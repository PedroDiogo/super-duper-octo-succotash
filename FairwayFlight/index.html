<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FairwayFlight - Golf Simulation</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      text-shadow: 1px 1px 2px black;
    }
    #club-selector {
      margin-top: 10px;
      padding: 8px 12px;
      font-size: 16px;
      background: white;
      border: 2px solid #2e7d32;
      border-radius: 6px;
      cursor: pointer;
      width: 200px;
    }
    #swing-btn {
      padding: 12px 24px;
      font-size: 18px;
      background: #2e7d32;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 10px;
    }
    #swing-btn:hover { background: #1b5e20; }
    #swing-btn:disabled { background: #666; cursor: not-allowed; }
    #stats { margin-top: 15px; font-size: 14px; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>FairwayFlight</h1>
    <select id="club-selector">
      <option value="driver">Driver</option>
      <option value="wood3">3 Wood</option>
      <option value="wood5">5 Wood</option>
      <option value="hybrid5">5 Hybrid</option>
      <option value="iron6">6 Iron</option>
      <option value="iron7">7 Iron</option>
      <option value="iron8">8 Iron</option>
      <option value="iron9">9 Iron</option>
      <option value="pw" selected>Pitching Wedge</option>
      <option value="sw">Sand Wedge</option>
    </select>
    <button id="swing-btn">Swing!</button>
    <div id="stats">
      <p>Distance: <span id="distance">0</span> yards</p>
      <p>Max Height: <span id="height">0</span> yards</p>
      <p>Backspin: <span id="backspin">0</span> rpm</p>
      <p>Sidespin: <span id="sidespin">0</span> rpm</p>
    </div>
    <div style="margin-top: 10px; font-size: 12px; color: #ccc;">
      <p>Camera: Mouse drag to rotate, scroll to zoom</p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // Scene setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
    camera.position.set(-5, 3, 8);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
    sunLight.position.set(50, 100, 50);
    sunLight.castShadow = true;
    scene.add(sunLight);

    // Ground (fairway)
    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0x3a7d32 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Golf ball
    const ballGeo = new THREE.SphereGeometry(0.02, 32, 32);
    const ballMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    const ball = new THREE.Mesh(ballGeo, ballMat);
    ball.castShadow = true;
    ball.position.set(0, 0.02, 0);
    scene.add(ball);

    // Club - pivot point at grip, shaft and head extend outward
    const clubGroup = new THREE.Group();

    // Shaft - extends along negative Y from origin (grip)
    const shaftLength = 1.0;
    const shaftGeo = new THREE.CylinderGeometry(0.012, 0.012, shaftLength, 8);
    const shaftMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
    const shaft = new THREE.Mesh(shaftGeo, shaftMat);
    shaft.position.y = -shaftLength / 2;
    clubGroup.add(shaft);

    // Club head - attached at end of shaft, facing the swing direction
    const headGeo = new THREE.BoxGeometry(0.12, 0.03, 0.08);
    const headMat = new THREE.MeshLambertMaterial({ color: 0x666666 });
    const head = new THREE.Mesh(headGeo, headMat);
    head.position.set(0.06, -shaftLength, 0);
    clubGroup.add(head);

    // Grip indicator (small sphere at pivot)
    const gripGeo = new THREE.SphereGeometry(0.025, 8, 8);
    const gripMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
    const grip = new THREE.Mesh(gripGeo, gripMat);
    clubGroup.add(grip);

    // Position: grip above ball, club hangs down
    // At rotation.z = 0, head is at (0.06, -1, 0) relative to group
    // Ball is at (0, 0.02, 0), so position group at (0, 1.02, 0)
    clubGroup.position.set(0, 1.02, 0);
    clubGroup.rotation.z = -Math.PI / 2; // Backswing: club points backward
    scene.add(clubGroup);

    // Trajectory line
    let trajectoryLine = null;

    // Physics parameters
    const GRAVITY = 9.81;  // m/s²
    const YARDS_PER_METER = 1.094;
    const AIR_DENSITY = 1.225;  // kg/m³ at sea level
    const BALL_MASS = 0.0459;  // kg (regulation golf ball)
    const BALL_DIAMETER = 0.0427;  // m (regulation golf ball)
    const BALL_AREA = Math.PI * (BALL_DIAMETER / 2) * (BALL_DIAMETER / 2);

    // Simulation state
    let isFlying = false;
    let flightTime = 0;
    let position = { x: 0, y: 0.02, z: 0 };
    let velocity = { x: 0, y: 0, z: 0 };
    let spinRate = { backspin: 0, sidespin: 0 };  // rpm
    let trajectoryPoints = [];
    let tracedPoints = []; // Points traced so far during flight
    let maxHeight = 0;

    // Club definitions with loft angles and types
    const clubs = {
      driver: {
        name: 'Driver',
        loft: 10.5,
        type: 'driver'
      },
      wood3: {
        name: '3 Wood',
        loft: 15,
        type: 'wood'
      },
      wood5: {
        name: '5 Wood',
        loft: 19,
        type: 'wood'
      },
      hybrid5: {
        name: '5 Hybrid',
        loft: 27,
        type: 'hybrid'
      },
      iron6: {
        name: '6 Iron',
        loft: 31,
        type: 'iron'
      },
      iron7: {
        name: '7 Iron',
        loft: 34,
        type: 'iron'
      },
      iron8: {
        name: '8 Iron',
        loft: 37,
        type: 'iron'
      },
      iron9: {
        name: '9 Iron',
        loft: 41,
        type: 'iron'
      },
      pw: {
        name: 'Pitching Wedge',
        loft: 46,
        type: 'wedge'
      },
      sw: {
        name: 'Sand Wedge',
        loft: 56,
        type: 'wedge'
      }
    };

    // Swing speeds by club type (calibrated for Magnus effect)
    const swingSpeeds = {
      driver: 62,    // m/s (~139 mph)
      wood: 56,      // m/s (~125 mph)
      hybrid: 48,    // m/s (~107 mph)
      iron: 44,      // m/s (~98 mph)
      wedge: 33      // m/s (~74 mph)
    };

    // Calculate smash factor based on loft and club type
    function getSmashFactor(loft, clubType) {
      if (clubType === 'driver' || clubType === 'wood') {
        return 1.48 - (loft * 0.003);
      } else if (clubType === 'hybrid') {
        return 1.40 - (loft * 0.004);
      } else if (clubType === 'iron') {
        return 1.43 - (loft * 0.0055);  // More aggressive drop for irons
      } else {  // wedges
        return 1.42 - (loft * 0.005);
      }
    }

    // Calculate launch angle from club loft and type
    function getLaunchAngle(loft, clubType) {
      if (clubType === 'driver') {
        return loft + 2;  // Driver launches above static loft
      } else if (clubType === 'wood') {
        return loft + 1;  // Woods launch slightly above loft
      } else if (clubType === 'hybrid') {
        return loft * 0.9;
      } else if (clubType === 'iron') {
        return loft * 0.85;
      } else {  // wedges
        return loft * 0.75;
      }
    }

    // Get ball speed from club head speed, loft, and type
    function getBallSpeed(loft, clubType) {
      let swingSpeed = swingSpeeds[clubType];
      // 5 wood gets slightly lower swing speed
      if (loft === 19) {
        swingSpeed *= 0.95;
      }
      return swingSpeed * getSmashFactor(loft, clubType);
    }

    // Calculate backspin rate based on club type and loft
    // Calibrated for realistic distances with Magnus effect
    function getBackspin(loft, clubType, ballSpeed) {
      if (clubType === 'driver') {
        return 2200 + loft * 30;  // ~2500 rpm
      } else if (clubType === 'wood') {
        return 3000 + loft * 50;  // ~3750-3950 rpm
      } else if (clubType === 'hybrid') {
        return 3500 + loft * 60;  // ~5120 rpm
      } else if (clubType === 'iron') {
        return 4000 + loft * 80;  // ~6480-7280 rpm
      } else {  // wedges
        return 6000 + loft * 70;  // ~9220-9920 rpm
      }
    }

    // Calculate drag coefficient (Cd) based on ball speed
    // Golf balls have lower Cd at higher speeds (drag crisis)
    function getDragCoefficient(speed) {
      // Reynolds number approximation
      const Re = (speed * BALL_DIAMETER) / 0.000015;  // kinematic viscosity of air

      // Cd varies from ~0.5 at low speed to ~0.2 at high speed
      if (Re < 100000) {
        return 0.5;
      } else if (Re > 200000) {
        return 0.23;
      } else {
        // Linear interpolation in transition region
        const t = (Re - 100000) / 100000;
        return 0.5 - (0.27 * t);
      }
    }

    // Calculate lift coefficient (Cl) based on spin rate
    // Magnus effect: spinning ball generates lift perpendicular to velocity
    function getLiftCoefficient(spinRpm, speed) {
      // Convert rpm to rad/s
      const omega = spinRpm * 2 * Math.PI / 60;

      // Spin parameter: S = rω/v
      const spinParameter = (BALL_DIAMETER / 2) * omega / Math.max(speed, 0.1);

      // Cl roughly proportional to spin parameter
      // Typical golf ball Cl = 0.1 to 0.3
      const Cl = Math.min(0.25 * spinParameter, 0.35);

      return Cl;
    }

    // Get current club with calculated parameters
    function getCurrentClub() {
      const clubId = document.getElementById('club-selector').value;
      const club = clubs[clubId];
      const ballSpeed = getBallSpeed(club.loft, club.type);
      return {
        name: club.name,
        loft: club.loft,
        type: club.type,
        speed: ballSpeed,
        angle: getLaunchAngle(club.loft, club.type),
        backspin: getBackspin(club.loft, club.type, ballSpeed)
      };
    }

    // No longer used - trajectory is calculated dynamically with aerodynamic forces
    function calculateTrajectory() {
      trajectoryPoints = [];
      return trajectoryPoints;
    }

    function updateTrajectory(points) {
      if (trajectoryLine) scene.remove(trajectoryLine);

      // Need at least 2 points to draw a path
      if (points.length < 2) return;

      // Create a curve from the traced points
      const curve = new THREE.CatmullRomCurve3(points);
      const tubeGeometry = new THREE.TubeGeometry(curve, Math.max(points.length * 2, 20), 0.05, 8, false);
      const material = new THREE.MeshBasicMaterial({
        color: 0xff0000,
        transparent: true,
        opacity: 0.8
      });
      trajectoryLine = new THREE.Mesh(tubeGeometry, material);
      scene.add(trajectoryLine);
    }

    function swing() {
      if (isFlying) return;

      // Animate club swing - full arc from backswing to follow-through
      const swingDuration = 500;
      const startRotation = -Math.PI / 2;   // Backswing: club horizontal behind
      const impactRotation = 0;              // Impact: club vertical, head at ball
      const endRotation = Math.PI * 0.7;     // Follow-through: club wraps around
      const startTime = Date.now();

      function animateSwing() {
        const elapsed = Date.now() - startTime;
        const progress = Math.min(elapsed / swingDuration, 1);

        // Custom easing: accelerate into impact, decelerate after
        let eased;
        if (progress < 0.5) {
          // Accelerating downswing
          eased = 2 * progress * progress;
        } else {
          // Decelerating follow-through
          eased = 1 - Math.pow(-2 * progress + 2, 2) / 2;
        }

        clubGroup.rotation.z = startRotation + (endRotation - startRotation) * eased;

        // Trigger ball flight at impact (~50% through swing when club is vertical)
        if (progress >= 0.5 && !isFlying) {
          startFlight();
        }

        if (progress < 1) {
          requestAnimationFrame(animateSwing);
        }
      }

      animateSwing();
    }

    function startFlight() {
      isFlying = true;
      flightTime = 0;
      maxHeight = 0;
      tracedPoints = []; // Clear traced points for new shot

      const club = getCurrentClub();

      // Add realistic shot dispersion
      // Ball speed variation: ±2.5% (contact quality)
      const speedVariation = 1.0 + (Math.random() - 0.5) * 0.05;
      const launchSpeed = club.speed * speedVariation;

      // Vertical angle variation: ±1.5 degrees
      const verticalVariation = (Math.random() - 0.5) * 3;
      const launchAngle = (club.angle + verticalVariation) * Math.PI / 180;

      // Horizontal direction variation: ±5 degrees (slice/hook/draw/fade)
      const horizontalVariation = (Math.random() - 0.5) * 10;
      const launchDirection = horizontalVariation * Math.PI / 180;

      // Backspin variation: ±10%
      const spinVariation = 1.0 + (Math.random() - 0.5) * 0.2;
      const backspinRpm = club.backspin * spinVariation;

      // Sidespin from horizontal dispersion (slice/hook)
      // More dispersion = more sidespin
      const sidespinRpm = horizontalVariation * 150;  // ~±750 rpm sidespin

      // Initialize position
      position = { x: 0, y: 0.02, z: 0 };

      // Initialize velocity with horizontal dispersion
      const forwardSpeed = launchSpeed * Math.cos(launchAngle);
      velocity = {
        x: forwardSpeed * Math.cos(launchDirection),
        y: launchSpeed * Math.sin(launchAngle),
        z: forwardSpeed * Math.sin(launchDirection)
      };

      // Initialize spin
      spinRate = {
        backspin: backspinRpm,
        sidespin: sidespinRpm
      };

      // Start with ball's initial position
      tracedPoints.push(new THREE.Vector3(position.x, position.y, position.z));

      document.getElementById('swing-btn').disabled = true;
    }

    function updateBall(deltaTime) {
      if (!isFlying) return;

      flightTime += deltaTime;

      // Calculate current ball speed
      const speed = Math.sqrt(velocity.x * velocity.x + velocity.y * velocity.y + velocity.z * velocity.z);

      if (speed < 0.1) {
        // Ball has essentially stopped
        isFlying = false;
        position.y = 0.02;
        setTimeout(reset, 2000);
        return;
      }

      // Unit velocity vector
      const vx = velocity.x / speed;
      const vy = velocity.y / speed;
      const vz = velocity.z / speed;

      // Calculate aerodynamic coefficients
      const Cd = getDragCoefficient(speed);
      const Cl_backspin = getLiftCoefficient(spinRate.backspin, speed);
      const Cl_sidespin = getLiftCoefficient(Math.abs(spinRate.sidespin), speed);

      // Calculate forces
      const dynamicPressure = 0.5 * AIR_DENSITY * speed * speed * BALL_AREA;

      // 1. Gravity (downward)
      const F_gravity = -BALL_MASS * GRAVITY;  // y-direction

      // 2. Drag force (opposite to velocity)
      const F_drag = dynamicPressure * Cd;
      const F_drag_x = -F_drag * vx;
      const F_drag_y = -F_drag * vy;
      const F_drag_z = -F_drag * vz;

      // 3. Magnus lift force from backspin (perpendicular to velocity, upward)
      // Lift direction: perpendicular to velocity in vertical plane
      // For backspin, lift is upward (perpendicular to horizontal velocity)
      const F_lift_backspin = dynamicPressure * Cl_backspin;

      // Lift perpendicular to velocity vector in vertical plane
      // Simplified: assume lift is mostly vertical when ball moving mostly horizontal
      const horizontalSpeed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
      const lift_x = F_lift_backspin * (-velocity.x * velocity.y) / (speed * Math.max(horizontalSpeed, 0.1));
      const lift_y = F_lift_backspin * horizontalSpeed / speed;
      const lift_z = F_lift_backspin * (-velocity.z * velocity.y) / (speed * Math.max(horizontalSpeed, 0.1));

      // 4. Magnus side force from sidespin (curves ball left/right)
      const F_side = dynamicPressure * Cl_sidespin;
      const sideForceDirection = spinRate.sidespin > 0 ? 1 : -1;  // positive = right curve
      // Side force perpendicular to velocity in horizontal plane
      const side_x = -F_side * vz * sideForceDirection;
      const side_y = 0;
      const side_z = F_side * vx * sideForceDirection;

      // Total forces
      const F_x = F_drag_x + lift_x + side_x;
      const F_y = F_gravity + F_drag_y + lift_y + side_y;
      const F_z = F_drag_z + lift_z + side_z;

      // Acceleration = F / m
      const ax = F_x / BALL_MASS;
      const ay = F_y / BALL_MASS;
      const az = F_z / BALL_MASS;

      // Euler integration: update velocity and position
      velocity.x += ax * deltaTime;
      velocity.y += ay * deltaTime;
      velocity.z += az * deltaTime;

      position.x += velocity.x * deltaTime;
      position.y += velocity.y * deltaTime;
      position.z += velocity.z * deltaTime;

      // Ground collision
      if (position.y < 0.02) {
        position.y = 0.02;
        isFlying = false;
        setTimeout(reset, 2000);
      }

      // Update ball visual position
      ball.position.set(position.x, position.y, position.z);

      // Add current position to traced path
      tracedPoints.push(new THREE.Vector3(position.x, position.y, position.z));

      // Update the trajectory visualization
      updateTrajectory(tracedPoints);

      // Track max height
      if (position.y > maxHeight) maxHeight = position.y;

      // Update camera to follow ball in 3D
      camera.position.x = position.x - 5;
      camera.position.y = Math.max(3, position.y + 2);
      camera.position.z = position.z + 8;
      camera.lookAt(ball.position);

      // Update stats (total horizontal distance including lateral movement)
      const totalDistance = Math.sqrt(position.x * position.x + position.z * position.z);
      document.getElementById('distance').textContent = Math.round(totalDistance * YARDS_PER_METER);
      document.getElementById('height').textContent = Math.round(maxHeight * YARDS_PER_METER);
      document.getElementById('backspin').textContent = Math.round(spinRate.backspin);
      document.getElementById('sidespin').textContent = Math.round(spinRate.sidespin);
    }

    function reset() {
      ball.position.set(0, 0.02, 0);
      clubGroup.rotation.z = -Math.PI / 2; // Back to backswing position

      // Reset camera to default position
      cameraDistance = 10;
      cameraAngleH = 0;
      cameraAngleV = 0.5;
      updateCameraPosition();

      // Reset state variables
      position = { x: 0, y: 0.02, z: 0 };
      velocity = { x: 0, y: 0, z: 0 };
      spinRate = { backspin: 0, sidespin: 0 };

      if (trajectoryLine) {
        scene.remove(trajectoryLine);
        trajectoryLine = null;
      }

      tracedPoints = []; // Clear traced path

      document.getElementById('swing-btn').disabled = false;
      document.getElementById('distance').textContent = '0';
      document.getElementById('height').textContent = '0';
      document.getElementById('backspin').textContent = '0';
      document.getElementById('sidespin').textContent = '0';
    }

    // Camera control state
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let cameraDistance = 10;
    let cameraAngleH = 0;  // Horizontal angle
    let cameraAngleV = 0.5;  // Vertical angle

    function updateCameraPosition() {
      if (!isFlying) {
        // Camera orbits around origin when not following ball
        camera.position.x = cameraDistance * Math.cos(cameraAngleV) * Math.sin(cameraAngleH);
        camera.position.y = cameraDistance * Math.sin(cameraAngleV);
        camera.position.z = cameraDistance * Math.cos(cameraAngleV) * Math.cos(cameraAngleH);
        camera.lookAt(0, 0, 0);
      }
    }

    // Mouse controls
    document.addEventListener('mousedown', (e) => {
      isDragging = true;
      previousMousePosition = { x: e.clientX, y: e.clientY };
    });

    document.addEventListener('mousemove', (e) => {
      if (isDragging && !isFlying) {
        const deltaX = e.clientX - previousMousePosition.x;
        const deltaY = e.clientY - previousMousePosition.y;

        cameraAngleH += deltaX * 0.01;
        cameraAngleV += deltaY * 0.01;

        // Limit vertical angle
        cameraAngleV = Math.max(-Math.PI / 2 + 0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleV));

        updateCameraPosition();

        previousMousePosition = { x: e.clientX, y: e.clientY };
      }
    });

    document.addEventListener('mouseup', () => {
      isDragging = false;
    });

    // Scroll to zoom
    document.addEventListener('wheel', (e) => {
      e.preventDefault();
      cameraDistance += e.deltaY * 0.01;
      cameraDistance = Math.max(3, Math.min(30, cameraDistance));
      updateCameraPosition();
    }, { passive: false });

    // Event listeners
    document.getElementById('swing-btn').addEventListener('click', swing);

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    let lastTime = 0;
    function animate(currentTime) {
      requestAnimationFrame(animate);

      const deltaTime = (currentTime - lastTime) / 1000;
      lastTime = currentTime;

      if (deltaTime < 0.1) { // Cap delta time
        updateBall(deltaTime);
      }

      renderer.render(scene, camera);
    }

    animate(0);
  </script>
</body>
</html>
